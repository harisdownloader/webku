<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARIS DOWNLOADER - ORCA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  background: linear-gradient(-45deg, #000000, #4a0000, #ff0000, #1a0000);
  background-size: 400% 400%;
  animation: bgAnim 8s ease infinite;
  font-family:sans-serif;padding:20px;
  overflow:hidden;position:relative;
}
@keyframes bgAnim{
  0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
}
.bubbles{position:absolute;width:100%;height:100%;top:0;left:0;z-index:0;overflow:hidden;pointer-events:none}
.bubble{position:absolute;bottom:-100px;background:rgba(255,0,0,0.3);border-radius:50%;animation:rise 10s infinite ease-in}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0.7}100%{transform:translateY(-110vh) scale(1.5);opacity:0}}
.box{
  position:relative;z-index:1;
  background:rgba(20,0,0,0.85);border:2px solid #ff0000;
  box-shadow:0 0 30px #ff0000, 0 0 60px #ff000055 inset;
  padding:24px;border-radius:24px;width:100%;max-width:400px;text-align:center;
  backdrop-filter:blur(8px);
  animation: pulseBox 2s infinite alternate;
}
@keyframes pulseBox{from{box-shadow:0 0 20px #ff0000}to{box-shadow:0 0 40px #ff0000, 0 0 80px #ff000055 inset}}
.logo-emoji{font-size:85px;animation: float 3s ease-in-out infinite;filter:drop-shadow(0 0 15px #ff0000)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(2deg)}}
h2{color:#ff2a2a;text-shadow:0 0 10px red;margin:8px 0 4px;letter-spacing:2px}
.sub{font-size:10px;color:#ff8888;margin-bottom:12px;animation: blink 1.5s infinite}
@keyframes blink{50%{opacity:0.5}}
input{width:92%;padding:12px;border-radius:12px;background:#000;border:1px solid #ff000066;color:#fff;margin:8px 0;outline:none}
input:focus{border-color:#ff0000;box-shadow:0 0 10px #ff0000}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:bold;margin:6px 0;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.95)}
.red{background:linear-gradient(90deg,#ff0000,#aa0000);color:#fff;box-shadow:0 0 15px #ff0000}
.dark{background:#000;color:#ff5555;border:1px solid #ff000044}
#out{margin-top:12px;font-size:12px;color:#0f0;min-height:20px}
canvas{display:none}
</style></head>
<body>
<div class="bubbles">
  <div class="bubble" style="left:10%;width:20px;height:20px;animation-delay:0s"></div>
  <div class="bubble" style="left:30%;width:35px;height:35px;animation-delay:2s"></div>
  <div class="bubble" style="left:60%;width:15px;height:15px;animation-delay:4s"></div>
  <div class="bubble" style="left:80%;width:25px;height:25px;animation-delay:1s"></div>
</div>

<div class="box">
<div class="logo-emoji">🐋</div>
<h2>ORCA DOWNLOADER</h2>
<div class="sub">● LIVE - webkudownloader.vercel.app</div>
<input id="url" placeholder="Paste Link TikTok / IG / YT">
<input type="file" id="file" accept="image/*">
<button class="btn red" onclick="downloadVideo()">DOWNLOAD VIDEO</button>
<button class="btn dark" onclick="makeSticker()">STIKER WA 512x512</button>
<button class="btn dark" onclick="makeHD()">HD FOTO 2X</button>
<div id="out">Tempel link bosku!</div>
<canvas id="cv"></canvas>
</div>
<script>
async function downloadVideo(){
 let u=document.getElementById('url').value.trim();
 if(!u){out.innerHTML='Paste link dulu bos!';return}
 out.innerHTML='⏳ Proses animasi merah...';
 try{
  let r=await fetch('https://www.tikwm.com/api/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'url='+encodeURIComponent(u)});
  let j=await r.json();
  if(j.data&&j.data.play) out.innerHTML=`<a href="${j.data.play}" target="_blank" style="color:#0f0">✅ DOWNLOAD NO WM</a>`;
  else out.innerHTML=`<a href="https://savefrom.net/${u}" target="_blank" style="color:#0f0">👉 BACKUP</a>`;
 }catch(e){out.innerHTML='Error! Coba lagi!'}
}
function makeSticker(){
 let f=document.getElementById('file').files[0]; if(!f){out.innerHTML='Upload foto dulu!';return}
 let img=new Image(); img.onload=()=>{
  let c=document.getElementById('cv'); c.width=512;c.height=512;
  let ctx=c.getContext('2d'); let s=Math.min(512/img.width,512/img.height); let w=img.width*s,h=img.height*s;
  ctx.clearRect(0,0,512,512); ctx.drawImage(img,(512-w)/2,(512-h)/2,w,h);
  c.toBlob(b=>{let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='orca_stiker.webp'; a.click(); out.innerHTML='✅ Stiker jadi!'},'image/webp');
 }; img.src=URL.createObjectURL(f);
}
function makeHD(){
 let f=document.getElementById('file').files[0]; if(!f){out.innerHTML='Upload foto dulu!';return}
 let img=new Image(); img.onload=()=>{
  let c=document.getElementById('cv'); c.width=img.width*2;c.height=img.height*2;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let a=document.createElement('a'); a.href=c.toDataURL('image/jpeg',0.95); a.download='orca_HD.jpg'; a.click(); out.innerHTML='✅ HD jadi!';
 }; img.src=URL.createObjectURL(f);
}
</script>
</body></html>
